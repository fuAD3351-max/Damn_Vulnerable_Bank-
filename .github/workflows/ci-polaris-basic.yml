name: CI-Polaris-SAST

on:
  workflow_dispatch:
  push:
    branches: [ polaris ]

env:
  BRIDGE_POLARIS_WAITFORSCAN: true
  TMPDIR: /var/tmp
  ANDROID_SDK_ROOT: /var/android-sdk
  ANDROID_HOME: /var/android-sdk

jobs:
  build:
    runs-on: [ self-hosted, linux, dev ]
    steps:
    - name: Checkout Source
      uses: actions/checkout@v5

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Add Gradle to PATH
      run: echo "/opt/gradle/gradle-7.6.4/bin" >> "$GITHUB_PATH"

    - name: Configure Android SDK PATH
      run: |
        echo "/var/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "/var/android-sdk/platform-tools" >> "$GITHUB_PATH"

    - name: Write local.properties
      run: |
        echo "sdk.dir=/var/android-sdk" > DamnVulnerableBank/local.properties

    # The project depends on two JCenter-only artifacts that no longer
    # exist anywhere (JCenter was shut down in 2021). Replace them with
    # modern Maven Central equivalents so the app compiles.
    #
    # - com.hanks:passcodeview:0.1.2 -> io.github.chaosleung:pinview:1.4.4
    # - com.android.volley:volley:1.1.1 -> com.android.volley:volley:1.2.1
    #
    # Source files referencing PasscodeView are patched to use PinView.
    - name: Replace dead JCenter dependencies
      run: |
        cd DamnVulnerableBank

        # Replace in app/build.gradle
        sed -i "s|com.hanks:passcodeview:0.1.2|io.github.chaosleung:pinview:1.4.4|g" app/build.gradle
        sed -i "s|com.android.volley:volley:1.1.1|com.android.volley:volley:1.2.1|g" app/build.gradle

        # Find Java files that use PasscodeView and show them
        echo "--- Files referencing PasscodeView ---"
        grep -rl "com.hanks.passcodeview" app/src/ || true

        # Replace the import and class references in Java sources
        grep -rl "com.hanks.passcodeview" app/src/ | while read f; do
          echo "Patching: $f"
          sed -i "s|com\.hanks\.passcodeview\.PasscodeView|com.chaosleung.pinview.PinView|g" "$f"
          sed -i "s|com\.hanks\.passcodeview\.PasscodeViewListener|com.chaosleung.pinview.PinViewListener|g" "$f"
        done

        echo "--- Patched app/build.gradle dependencies ---"
        grep -E "pinview|volley" app/build.gradle

    - name: Add testClasses Task Stub
      run: |
        cd DamnVulnerableBank
        cat >> app/build.gradle << 'EOF'

        tasks.register("testClasses") {
            doLast {
                println "Coverity stub: testClasses invoked"
            }
        }
        EOF

    - name: Polaris SAST Scan
      id: polaris-scan
      uses: blackduck-inc/black-duck-security-scan@v2
      with:
        polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
        polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        polaris_assessment_types: "SAST"
        polaris_waitForScan: true
        polaris_application_name: ${{ github.event.repository.name }}
        polaris_project_name: ${{ github.event.repository.name }}
        polaris_branch_name: "develop"
        mark_build_status: 'failure'
