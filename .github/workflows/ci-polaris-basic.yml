name: CI-Polaris-Basic

on:
  workflow_dispatch:
  push:
    branches: [ polaris ]

env:
  BRIDGE_POLARIS_WAITFORSCAN: true

jobs:
  build:
    runs-on: [ self-hosted, linux, dev ]
    steps:
    - name: Checkout Source
      uses: actions/checkout@v5

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    # Add the manually installed Gradle to PATH for Coverity
    - name: Add Gradle to PATH
      run: echo "/home/sechard/tools/gradle-7.6.4/bin" >> "$GITHUB_PATH"

    # Setup Android SDK for SAST to build the project successfully
    - name: Setup Android SDK
      uses: amyu/setup-android@v6
      with:
        sdk-version: '34' # Adjust this to match your project's compileSdkVersion
        build-tools-version: '34.0.0' # Optional: match your project if needed

    # Install Python dependencies for SCA
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<71.0.0" wheel
        python -m pip install -r requirements.txt

    - name: Polaris Scan
      id: polaris-scan
      uses: blackduck-inc/black-duck-security-scan@v2
      with:
        ### SCANNING: Required fields
        polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
        polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        polaris_assessment_types: "SCA,SAST"

        blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL,HIGH'

        polaris_waitForScan: true

        ### SCANNING: Optional fields
        polaris_application_name: ${{ github.event.repository.name }}
        polaris_project_name: ${{ github.event.repository.name }}
        polaris_branch_name: "develop"

        ### Enforce policy violations to break the pipeline
        mark_build_status: 'failure'
