name: CI-Polaris-Basic

on:
  workflow_dispatch:
  push:
    branches: [ polaris ]

env:
  BRIDGE_POLARIS_WAITFORSCAN: true

jobs:
  build:
    runs-on: [ self-hosted, linux, dev ]
    steps:
    - name: Checkout Source
      uses: actions/checkout@v5

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    # Add the manually installed Gradle to PATH for Coverity.
    # Points to the user-owned copy to avoid the /opt permission issues.
    - name: Add Gradle to PATH
      run: echo "/home/sechard/tools/gradle-7.6.4/bin" >> "$GITHUB_PATH"

    # Setup Android SDK for SAST so Coverity can build the Android project.
    # Uses the official Android setup action (floating v4 tag is maintained).
    # Adjust the "platforms;android-XX" and "build-tools;XX.0.0" to match
    # the compileSdkVersion in DamnVulnerableBank/app/build.gradle.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'

    # Install Python dependencies for SCA.
    # Pinning setuptools<71.0.0 avoids the Python 3.8 incompatibility
    # that caused "importlib_metadata has no attribute EntryPoints".
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<71.0.0" wheel
        python -m pip install -r requirements.txt

    - name: Polaris Scan
      id: polaris-scan
      uses: blackduck-inc/black-duck-security-scan@v2
      with:
        ### SCANNING: Required fields
        polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
        polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        polaris_assessment_types: "SCA,SAST"

        blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL,HIGH'

        polaris_waitForScan: true

        ### SCANNING: Optional fields
        polaris_application_name: ${{ github.event.repository.name }}
        polaris_project_name: ${{ github.event.repository.name }}
        polaris_branch_name: "develop"

        ### Enforce policy violations to break the pipeline
        mark_build_status: 'failure'
